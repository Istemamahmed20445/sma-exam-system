<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Shahriar's Medical Academy</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>
    <div class="admin-container">
        <header class="admin-header">
            <h1>Admin Dashboard</h1>
            <div class="admin-actions">
                <a href="/admin/exam/create" class="btn-primary">Create New Exam</a>
                <button onclick="openBulkUpload()" class="btn-secondary">Bulk Upload Questions</button>
                <a href="/admin/logout" class="btn-secondary">Logout</a>
            </div>
        </header>

        <main class="admin-main">
            <div class="admin-section">
                <h2>Exams</h2>
                <div id="exams-list" class="cards-container">
                    <div class="loading">Loading exams...</div>
                </div>
            </div>

            <div class="admin-section">
                <h2>Student Results</h2>
                <div class="results-header">
                    <select id="exam-filter" onchange="filterResults()" class="form-group select" style="margin-right: 10px;">
                        <option value="">All Exams</option>
                    </select>
                    <button onclick="refreshResults()" class="btn-secondary">Refresh</button>
                    <button onclick="openImportResults()" class="btn-secondary">Import CSV</button>
                    <button onclick="exportResults()" class="btn-secondary">Export CSV</button>
                </div>
                <div id="results-list" class="results-container">
                    <div class="loading">Loading results...</div>
                </div>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/firebase-config.js') }}"></script>
    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
    <script>
        async function loadExams() {
            try {
                const response = await fetch('/api/exams');
                const data = await response.json();
                
                if (data.success) {
                    displayExams(data.exams);
                } else {
                    document.getElementById('exams-list').innerHTML = 
                        '<div class="error">Failed to load exams.</div>';
                }
            } catch (error) {
                document.getElementById('exams-list').innerHTML = 
                    '<div class="error">Error loading exams.</div>';
            }
        }

        function displayExams(exams) {
            const container = document.getElementById('exams-list');
            
            if (exams.length === 0) {
                container.innerHTML = '<div class="no-data">No exams created yet.</div>';
                return;
            }

            container.innerHTML = exams.map(exam => `
                <div class="card">
                    <h3>${exam.title}</h3>
                    <div class="card-info">
                        <p><strong>Duration:</strong> ${exam.duration} minutes</p>
                        <p><strong>Questions:</strong> ${exam.questions ? exam.questions.length : 0}</p>
                        <p><strong>Passing Marks:</strong> ${exam.passing_marks}%</p>
                    </div>
                    <div class="card-actions">
                        <a href="/admin/exam/edit/${exam.exam_id}" class="btn-edit">Edit</a>
                        <button onclick="deleteExam('${exam.exam_id}')" class="btn-delete">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        async function deleteExam(examId) {
            if (!confirm('Are you sure you want to delete this exam?')) {
                return;
            }

            try {
                const response = await fetch(`/api/exam/delete/${examId}`, {
                    method: 'DELETE'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    loadExams();
                } else {
                    alert('Failed to delete exam: ' + data.error);
                }
            } catch (error) {
                alert('Error deleting exam: ' + error.message);
            }
        }

        let allResults = [];

        async function loadResults() {
            try {
                const response = await fetch('/api/results');
                const data = await response.json();
                
                if (data.success) {
                    allResults = data.results;
                    populateExamFilter();
                    displayResults(allResults);
                } else {
                    document.getElementById('results-list').innerHTML = 
                        '<div class="error">Failed to load results.</div>';
                }
            } catch (error) {
                document.getElementById('results-list').innerHTML = 
                    '<div class="error">Error loading results.</div>';
            }
        }

        function populateExamFilter() {
            const examFilter = document.getElementById('exam-filter');
            const examTitles = [...new Set(allResults.map(r => r.exam_title))].sort();
            
            examFilter.innerHTML = '<option value="">All Exams</option>';
            examTitles.forEach(title => {
                examFilter.innerHTML += `<option value="${title}">${title}</option>`;
            });
        }

        function filterResults() {
            const selectedExam = document.getElementById('exam-filter').value;
            
            if (selectedExam === '') {
                displayResults(allResults);
            } else {
                const filtered = allResults.filter(r => r.exam_title === selectedExam);
                displayResults(filtered);
            }
        }

        function displayResults(results) {
            const container = document.getElementById('results-list');
            
            if (results.length === 0) {
                container.innerHTML = '<div class="no-data">No results found.</div>';
                return;
            }

            container.innerHTML = `
                <table class="results-table">
                    <thead>
                        <tr>
                            <th>Student Name</th>
                            <th>Exam</th>
                            <th>Score</th>
                            <th>Percentage</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${results.map(result => `
                            <tr>
                                <td>${result.student_name}${result.student_email ? `<br><small>${result.student_email}</small>` : ''}</td>
                                <td>${result.exam_title}</td>
                                <td>${result.score}/${result.total_questions}</td>
                                <td>${result.percentage}%</td>
                                <td>${new Date(result.submitted_at).toLocaleString()}</td>
                                <td>
                                    <a href="/results/${result.result_id}" target="_blank" class="btn-edit" style="text-decoration: none; display: inline-block; margin-right: 5px;">View</a>
                                    <button onclick="deleteResult('${result.result_id}')" class="btn-delete-small">Delete</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        async function deleteResult(resultId) {
            if (!confirm('Are you sure you want to delete this result?')) {
                return;
            }

            try {
                const response = await fetch(`/api/result/delete/${resultId}`, {
                    method: 'DELETE'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    loadResults();
                } else {
                    alert('Failed to delete result: ' + data.error);
                }
            } catch (error) {
                alert('Error deleting result: ' + error.message);
            }
        }

        function refreshResults() {
            loadResults();
        }

        function exportResults() {
            const selectedExam = document.getElementById('exam-filter').value;
            let resultsToExport = selectedExam === '' ? allResults : allResults.filter(r => r.exam_title === selectedExam);
            
            if (resultsToExport.length === 0) {
                alert('No results to export');
                return;
            }
            
            // Create CSV content
            const headers = ['Student Name', 'Email', 'Exam Title', 'Score', 'Total Questions', 'Percentage', 'Submitted At'];
            const rows = resultsToExport.map(result => [
                result.student_name,
                result.student_email || '',
                result.exam_title,
                result.score,
                result.total_questions,
                result.percentage,
                new Date(result.submitted_at).toISOString()
            ]);
            
            // Combine headers and rows
            const csvContent = [
                headers.join(','),
                ...rows.map(row => row.map(cell => `"${cell}"`).join(','))
            ].join('\n');
            
            // Create download link
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = window.URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            
            const filename = selectedExam 
                ? `results_${selectedExam.replace(/[^a-z0-9]/gi, '_')}_${new Date().toISOString().split('T')[0]}.csv`
                : `results_all_${new Date().toISOString().split('T')[0]}.csv`;
            
            link.download = filename;
            link.click();
            window.URL.revokeObjectURL(url);
        }

        // Bulk Upload Functions
        function openBulkUpload() {
            // Get exam selection if there are exams
            const examSelect = `
                <div class="bulk-upload-modal" id="bulk-upload-modal">
                    <div class="modal-content">
                        <h2>Bulk Upload Questions</h2>
                        <p>Upload a CSV file with questions. Download template for format.</p>
                        
                        <div class="form-group">
                            <label>Select Exam</label>
                            <select id="bulk-exam-select" class="form-group select">
                                <option value="">-- Select Exam --</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <button onclick="downloadTemplate()" class="btn-secondary">Download Template</button>
                        </div>
                        
                        <div class="form-group">
                            <label>Upload CSV File</label>
                            <input type="file" id="bulk-csv-file" accept=".csv" onchange="validateBulkUpload()">
                        </div>
                        
                        <div id="bulk-preview" style="display: none;"></div>
                        
                        <div class="modal-buttons">
                            <button onclick="closeBulkUpload()" class="btn-secondary">Cancel</button>
                            <button onclick="importBulkQuestions()" id="bulk-import-btn" class="btn-primary" style="display: none;">Import Questions</button>
                        </div>
                    </div>
                </div>
            `;
            
            document.body.insertAdjacentHTML('beforeend', examSelect);
            
            // Populate exam select
            populateExamSelect();
        }
        
        function populateExamSelect() {
            fetch('/api/exams')
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        const select = document.getElementById('bulk-exam-select');
                        select.innerHTML = '<option value="">-- Select Exam --</option>';
                        data.exams.forEach(exam => {
                            select.innerHTML += `<option value="${exam.exam_id}">${exam.title}</option>`;
                        });
                    }
                });
        }
        
        function downloadTemplate() {
            window.location.href = '/api/bulk-upload-template';
        }
        
        function closeBulkUpload() {
            document.getElementById('bulk-upload-modal').remove();
        }
        
        function validateBulkUpload() {
            const fileInput = document.getElementById('bulk-csv-file');
            const examId = document.getElementById('bulk-exam-select').value;
            
            if (!examId) {
                alert('Please select an exam first');
                return;
            }
            
            if (!fileInput.files.length) {
                return;
            }
            
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            
            fetch('/api/bulk-upload-validate', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showBulkPreview(data);
                } else {
                    alert('Error: ' + data.error);
                }
            })
            .catch(error => {
                alert('Error validating file: ' + error.message);
            });
        }
        
        function showBulkPreview(data) {
            const preview = document.getElementById('bulk-preview');
            const importBtn = document.getElementById('bulk-import-btn');
            
            let html = `
                <div class="bulk-preview-info">
                    <h3>Preview</h3>
                    <p><strong>Total Rows:</strong> ${data.total_rows}</p>
                    <p><strong>Valid Questions:</strong> ${data.valid_questions}</p>
                    ${data.errors.length > 0 ? `<p class="error"><strong>Errors:</strong> ${data.errors.length}</p>` : ''}
                </div>
            `;
            
            if (data.errors.length > 0) {
                html += '<div class="bulk-errors"><h4>Errors:</h4><ul>';
                data.errors.forEach(err => {
                    html += `<li>${err}</li>`;
                });
                html += '</ul></div>';
            }
            
            if (data.valid_questions > 0) {
                html += '<div class="bulk-questions"><h4>Sample Questions:</h4>';
                data.questions.slice(0, 3).forEach((q, i) => {
                    html += `
                        <div class="bulk-question-sample">
                            <p><strong>Q${i+1}:</strong> ${q.question_text}</p>
                            <p><strong>Correct Answer:</strong> ${q.options[q.correct_answer]}</p>
                        </div>
                    `;
                });
                html += '</div>';
                
                importBtn.style.display = 'inline-block';
                window.bulkQuestionsData = data;
            }
            
            preview.innerHTML = html;
            preview.style.display = 'block';
        }
        
        function importBulkQuestions() {
            const examId = document.getElementById('bulk-exam-select').value;
            const questions = window.bulkQuestionsData.questions;
            
            fetch('/api/bulk-upload-import', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    exam_id: examId,
                    questions: questions
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert(`Successfully imported ${data.imported} questions!\nTotal questions in exam: ${data.total_questions}`);
                    closeBulkUpload();
                    loadExams();
                } else {
                    alert('Error: ' + data.error);
                }
            })
            .catch(error => {
                alert('Error importing questions: ' + error.message);
            });
        }

        // CSV Import Functions
        function openImportResults() {
            const importModal = `
                <div class="bulk-upload-modal" id="import-results-modal">
                    <div class="modal-content">
                        <h2>Import Results from CSV</h2>
                        <p>Upload a CSV file with results data. Download template for format.</p>
                        
                        <div class="form-group">
                            <button onclick="downloadResultsTemplate()" class="btn-secondary">Download Template</button>
                        </div>
                        
                        <div class="form-group">
                            <label>Upload CSV File</label>
                            <input type="file" id="results-csv-file" accept=".csv" onchange="handleResultsFile()">
                        </div>
                        
                        <div id="results-preview" style="display: none;"></div>
                        
                        <div class="modal-buttons">
                            <button onclick="closeImportResults()" class="btn-secondary">Cancel</button>
                            <button onclick="importResultsCSV()" id="import-results-btn" class="btn-primary" style="display: none;">Import Results</button>
                        </div>
                    </div>
                </div>
            `;
            
            document.body.insertAdjacentHTML('beforeend', importModal);
        }
        
        function closeImportResults() {
            document.getElementById('import-results-modal').remove();
        }
        
        function downloadResultsTemplate() {
            // Create CSV template for results
            const csvContent = `student_name,student_email,exam_title,score,total_questions,percentage,submitted_at
John Doe,john@example.com,Mock Exam 1,45,50,90.0,2024-01-15T10:30:00
Jane Smith,jane@example.com,Mock Exam 1,38,50,76.0,2024-01-15T11:00:00`;
            
            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'results_template.csv';
            a.click();
            window.URL.revokeObjectURL(url);
        }
        
        function handleResultsFile() {
            const fileInput = document.getElementById('results-csv-file');
            if (!fileInput.files.length) return;
            
            const file = fileInput.files[0];
            const reader = new FileReader();
            
            reader.onload = function(e) {
                const csv = e.target.result;
                const lines = csv.split('\n');
                const headers = lines[0].split(',');
                
                if (lines.length < 2) {
                    alert('CSV file is empty or has no data rows');
                    return;
                }
                
                const preview = document.getElementById('results-preview');
                const importBtn = document.getElementById('import-results-btn');
                
                preview.style.display = 'block';
                preview.innerHTML = `
                    <div class="bulk-preview-info">
                        <h3>Preview</h3>
                        <p><strong>Total Rows:</strong> ${lines.length - 1}</p>
                        <p><strong>Columns:</strong> ${headers.join(', ')}</p>
                    </div>
                `;
                
                importBtn.style.display = 'inline-block';
            };
            
            reader.readAsText(file);
        }
        
        async function importResultsCSV() {
            const fileInput = document.getElementById('results-csv-file');
            if (!fileInput.files.length) {
                alert('Please select a CSV file');
                return;
            }
            
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            
            try {
                const response = await fetch('/api/results/import', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert(`Successfully imported ${data.imported} results!`);
                    closeImportResults();
                    loadResults();
                } else {
                    alert('Error importing results: ' + data.error);
                }
            } catch (error) {
                alert('Error importing results: ' + error.message);
            }
        }

        // Load data on page load
        loadExams();
        loadResults();
    </script>
</body>
</html>

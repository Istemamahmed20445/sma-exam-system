<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results - Shahriar's Medical Academy</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/exam.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" class="logo">
                <div class="header-text">
                    <h1>Shahriar's Medical Academy</h1>
                    <p class="subtitle">Exam Results</p>
                </div>
            </div>
        </header>

        <main>
            <div id="results-container">
                <div class="loading">Loading results...</div>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/firebase-config.js') }}"></script>
    <script>
        const resultId = '{{ result_id }}';

        async function loadResults() {
            try {
                const response = await fetch(`/api/result/${resultId}`);
                const data = await response.json();
                
                if (data.success) {
                    displayResults(data.result);
                } else {
                    document.getElementById('results-container').innerHTML = 
                        '<div class="error">Failed to load results.</div>';
                }
            } catch (error) {
                document.getElementById('results-container').innerHTML = 
                    '<div class="error">Error loading results: ' + error.message + '</div>';
            }
        }

        function displayResults(result) {
            const exam = result.exam;
            const percentage = result.percentage;
            const passPercentage = exam.passing_marks;
            const passed = percentage >= passPercentage;
            
            // Debug: Log first question to check explanation data
            if (exam.questions && exam.questions.length > 0) {
                console.log('First question data:', exam.questions[0]);
                console.log('Has explanation:', exam.questions[0].explanation);
                console.log('Has explanation_image_url:', exam.questions[0].explanation_image_url);
            }
            
            const container = document.getElementById('results-container');
            container.innerHTML = `
                <div class="results-summary">
                    <h2>${exam.title}</h2>
                    <div class="student-info">
                        <p><strong>Student:</strong> ${result.student_name}</p>
                        ${result.student_email ? `<p><strong>Email:</strong> ${result.student_email}</p>` : ''}
                        <p><strong>Date:</strong> ${new Date(result.submitted_at).toLocaleString()}</p>
                    </div>
                    <div class="score-display ${passed ? 'passed' : 'failed'}">
                        <div class="score-circle">
                            <span class="score-percentage">${percentage.toFixed(1)}%</span>
                            <span class="score-label">Score</span>
                        </div>
                        <div class="score-details">
                            <p><strong>Marks:</strong> ${result.score} / ${result.total_questions}</p>
                            <p><strong>Passing Marks:</strong> ${passPercentage}%</p>
                            <p class="status"><strong>Status:</strong> ${passed ? 'PASSED ✓' : 'FAILED ✗'}</p>
                        </div>
                    </div>
                    <div style="margin-top: 16px;">
                        <button id="toggle-explanations-btn" class="btn-primary" onclick="toggleExplanations()">Show Answers & Explanations</button>
                    </div>
                </div>

                <div id="explanations-section" class="questions-review" style="display: none;">
                    <h3>Question Review</h3>
                    ${exam.questions.map((question, index) => {
                        const studentAnswer = result.answers[index];
                        const correctAnswer = question.correct_answer;
                        const isCorrect = studentAnswer === correctAnswer;
                        
                        // Debug logging for first question
                        if (index === 0) {
                            console.log('Question 1 full data:', JSON.stringify(question, null, 2));
                            console.log('Explanation value:', question.explanation);
                            console.log('Explanation type:', typeof question.explanation);
                            console.log('Explanation exists:', 'explanation' in question);
                            console.log('Explanation image URL:', question.explanation_image_url);
                        }
                        
                        // Safely get explanation with multiple fallbacks
                        // Check various possible field names and handle empty strings properly
                        let explanationText = '';
                        if (question.explanation !== undefined && question.explanation !== null) {
                            explanationText = String(question.explanation).trim();
                        } else if (question.Explanation !== undefined && question.Explanation !== null) {
                            explanationText = String(question.Explanation).trim();
                        }
                        
                        // If still empty, use fallback message
                        if (!explanationText) {
                            explanationText = 'No explanation provided.';
                        }
                        
                        // Safely get explanation image URL with multiple fallbacks
                        const explanationImageUrl = (question.explanation_image_url && question.explanation_image_url.trim()) || 
                                                    (question.explanationImageUrl && question.explanationImageUrl.trim()) ||
                                                    (question.ExplanationImageUrl && question.ExplanationImageUrl.trim()) ||
                                                    '';
                        
                        return `
                            <div class="question-review ${isCorrect ? 'correct' : 'incorrect'}">
                                <div class="question-header">
                                    <span class="question-num">Question ${index + 1}</span>
                                    <span class="answer-status">${isCorrect ? '✓ Correct' : '✗ Incorrect'}</span>
                                </div>
                                <div class="question-text">${question.question_text}</div>
                                ${question.question_image_url ? `
                                    <div class="question-image">
                                        <img src="${question.question_image_url}" alt="Question Image">
                                    </div>
                                ` : ''}
                                <div class="options-review">
                                    ${question.options.map((option, i) => {
                                        let optionClass = '';
                                        if (i === correctAnswer) optionClass = 'correct-answer';
                                        if (i === studentAnswer && !isCorrect) optionClass = 'wrong-answer';
                                        
                                        return `
                                            <div class="option-review ${optionClass}">
                                                ${i === studentAnswer ? '<span class="your-answer">Your Answer:</span>' : ''}
                                                ${i === correctAnswer ? '<span class="correct-label">Correct Answer:</span>' : ''}
                                                ${option}
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                                <div class="explanation">
                                    <strong>Explanation:</strong>
                                    <p>${explanationText}</p>
                                    ${explanationImageUrl ? `
                                        <div class="explanation-image">
                                            <img src="${explanationImageUrl}" alt="Explanation Image" onerror="console.error('Failed to load explanation image:', this.src); this.style.display='none';">
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;

            // Ensure section is hidden by default on render
            const section = document.getElementById('explanations-section');
            if (section) section.style.display = 'none';
        }

        function toggleExplanations() {
            const section = document.getElementById('explanations-section');
            const btn = document.getElementById('toggle-explanations-btn');
            if (!section || !btn) return;
            const isHidden = section.style.display === 'none';
            section.style.display = isHidden ? 'block' : 'none';
            btn.textContent = isHidden ? 'Hide Answers & Explanations' : 'Show Answers & Explanations';
        }

        // Load results on page load
        loadResults();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam - Shahriar's Medical Academy</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/exam.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="exam-container">
        <header class="exam-header">
            <div class="exam-info">
                <h1 id="exam-title">Loading...</h1>
                <p id="student-name"></p>
            </div>
            <div class="timer">
                <span class="timer-label">Time Remaining:</span>
                <span id="timer-display">00:00</span>
            </div>
        </header>

        <div class="exam-body">
            <div class="question-section">
                <div class="question-number">
                    Question <span id="current-question-num">1</span> of <span id="total-questions">0</span>
                </div>

                <div class="question-content">
                    <div id="question-text"></div>
                    <div id="question-image-container" style="display: none;">
                        <img id="question-image" src="" alt="Question Image">
                    </div>
                </div>

                <div class="options-container" id="options-container">
                    <!-- Options will be dynamically generated -->
                </div>

                <div class="navigation-buttons">
                    <button id="prev-btn" onclick="previousQuestion()" disabled>Previous</button>
                    <button id="next-btn" onclick="nextQuestion()">Next</button>
                    <button id="submit-btn" onclick="confirmSubmit()" style="display: none;">Submit Exam</button>
                </div>
            </div>

            <div class="sidebar">
                <div class="question-palette">
                    <h3>Questions</h3>
                    <div id="question-palette-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Submit Confirmation Modal -->
    <div id="submit-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2>Submit Exam?</h2>
            <p>Are you sure you want to submit your exam? You cannot change your answers after submission.</p>
            <div class="modal-buttons">
                <button onclick="closeModal()">Cancel</button>
                <button onclick="submitExam()" class="btn-danger">Submit</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/firebase-config.js') }}"></script>
    <script src="{{ url_for('static', filename='js/student.js') }}"></script>
    <script>
        // Get exam ID and student details from URL
        const examId = '{{ exam_id }}';
        const urlParams = new URLSearchParams(window.location.search);
        const studentName = urlParams.get('name') || 'Student';
        const studentEmail = urlParams.get('email') || '';

        document.getElementById('student-name').textContent = studentName;
        if (studentEmail) {
            document.getElementById('student-name').textContent += ` (${studentEmail})`;
        }

        // Initialize exam
        let examData = null;
        let currentQuestionIndex = 0;
        let answers = [];
        let timerInterval = null;
        let timeRemaining = 0;

        async function loadExam() {
            try {
                const response = await fetch(`/api/exam/${examId}`);
                const data = await response.json();
                
                if (data.success) {
                    examData = data.exam;
                    initializeExam(data.exam);
                } else {
                    alert('Failed to load exam. Please try again.');
                    window.location.href = '/';
                }
            } catch (error) {
                alert('Error loading exam: ' + error.message);
                window.location.href = '/';
            }
        }

        function initializeExam(exam) {
            document.getElementById('exam-title').textContent = exam.title;
            document.getElementById('total-questions').textContent = exam.questions.length;
            
            // Initialize answers array
            answers = new Array(exam.questions.length).fill(null);
            
            // Set timer
            timeRemaining = exam.duration * 60; // Convert minutes to seconds
            console.log('Exam duration:', exam.duration, 'minutes =', timeRemaining, 'seconds');
            updateTimerDisplay(); // Update display immediately
            startTimer();
            
            // Display first question
            displayQuestion(0);
            
            // Create question palette
            createQuestionPalette(exam.questions.length);
        }

        function displayQuestion(index) {
            currentQuestionIndex = index;
            const question = examData.questions[index];
            
            // Update question number
            document.getElementById('current-question-num').textContent = index + 1;
            
            // Display question text
            document.getElementById('question-text').textContent = question.question_text;
            
            // Display question image if available
            const imageContainer = document.getElementById('question-image-container');
            if (question.question_image_url) {
                document.getElementById('question-image').src = question.question_image_url;
                imageContainer.style.display = 'block';
            } else {
                imageContainer.style.display = 'none';
            }
            
            // Display options
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = question.options.map((option, i) => `
                <label class="option-label">
                    <input type="radio" name="answer" value="${i}" ${answers[index] === i ? 'checked' : ''}>
                    <span>${option}</span>
                </label>
            `).join('');
            
            // Update navigation buttons
            document.getElementById('prev-btn').disabled = index === 0;
            document.getElementById('next-btn').style.display = index === examData.questions.length - 1 ? 'none' : 'inline-block';
            document.getElementById('submit-btn').style.display = index === examData.questions.length - 1 ? 'inline-block' : 'none';
            
            // Update palette
            updateQuestionPalette();
        }

        function createQuestionPalette(totalQuestions) {
            const paletteGrid = document.getElementById('question-palette-grid');
            paletteGrid.innerHTML = '';
            
            for (let i = 0; i < totalQuestions; i++) {
                const btn = document.createElement('button');
                btn.className = 'palette-btn';
                btn.textContent = i + 1;
                btn.onclick = () => {
                    saveCurrentAnswer();
                    displayQuestion(i);
                };
                paletteGrid.appendChild(btn);
            }
        }

        function updateQuestionPalette() {
            const buttons = document.querySelectorAll('.palette-btn');
            buttons.forEach((btn, i) => {
                btn.classList.remove('current', 'answered');
                if (i === currentQuestionIndex) {
                    btn.classList.add('current');
                }
                if (answers[i] !== null) {
                    btn.classList.add('answered');
                }
            });
        }

        function previousQuestion() {
            saveCurrentAnswer();
            if (currentQuestionIndex > 0) {
                displayQuestion(currentQuestionIndex - 1);
            }
        }

        function nextQuestion() {
            saveCurrentAnswer();
            if (currentQuestionIndex < examData.questions.length - 1) {
                displayQuestion(currentQuestionIndex + 1);
            }
        }

        function saveCurrentAnswer() {
            const selectedOption = document.querySelector('input[name="answer"]:checked');
            if (selectedOption) {
                answers[currentQuestionIndex] = parseInt(selectedOption.value);
            }
        }

        function startTimer() {
            console.log('Starting timer with:', timeRemaining, 'seconds');
            timerInterval = setInterval(() => {
                timeRemaining--;
                console.log('Timer tick:', timeRemaining);
                updateTimerDisplay();
                
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    alert('Time is up! Your exam will be submitted automatically.');
                    submitExam();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;
            const displayText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            console.log('Updating timer display:', displayText);
            const timerElement = document.getElementById('timer-display');
            
            if (timerElement) {
                timerElement.textContent = displayText;
                
                // Change color when time is running out
                if (timeRemaining <= 60) {
                    timerElement.classList.add('warning');
                } else {
                    timerElement.classList.remove('warning');
                }
            } else {
                console.error('Timer display element not found!');
            }
        }

        function confirmSubmit() {
            saveCurrentAnswer();
            const modal = document.getElementById('submit-modal');
            if (modal) {
                modal.style.display = 'flex';
                modal.style.visibility = 'visible';
                modal.style.opacity = '1';
            }
        }

        function closeModal() {
            const modal = document.getElementById('submit-modal');
            if (modal) {
                modal.style.display = 'none';
            }
        }

        async function submitExam() {
            clearInterval(timerInterval);
            
            // Close the submit modal immediately and forcefully
            const modal = document.getElementById('submit-modal');
            if (modal) {
                modal.style.display = 'none';
                modal.style.visibility = 'hidden';
                modal.style.opacity = '0';
            }
            
            // Show loading state
            showLoadingState();
            
            try {
                console.log('Submitting exam...', { examId, studentName, studentEmail, answersCount: answers.length });
                
                // Calculate time taken safely
                const timeTaken = examData ? (examData.duration * 60) - timeRemaining : 0;
                
                const response = await fetch('/api/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        exam_id: examId,
                        student_name: studentName,
                        student_email: studentEmail,
                        answers: answers,
                        time_taken: timeTaken
                    })
                });
                
                console.log('Submit response status:', response.status);
                const data = await response.json();
                console.log('Submit response data:', data);
                
                if (data.success && data.result_id) {
                    console.log('Fetching detailed results for:', data.result_id);
                    // Fetch detailed results
                    const resultsResponse = await fetch(`/api/result/${data.result_id}`);
                    console.log('Results response status:', resultsResponse.status);
                    const resultsData = await resultsResponse.json();
                    console.log('Results data:', resultsData);
                    
                    if (resultsData.success) {
                        // The exam data is nested in result.exam
                        const exam = resultsData.result.exam;
                        console.log('Exam data structure:', exam);
                        console.log('Result data structure:', resultsData.result);
                        showResults(resultsData.result, exam);
                    } else {
                        console.error('Failed to load results:', resultsData);
                        // Fallback: show basic results without detailed review
                        showBasicResults(data, examData);
                    }
                } else {
                    console.error('Submit failed:', data);
                    showError('Failed to submit exam: ' + (data.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error submitting exam:', error);
                showError('Error submitting exam: ' + error.message);
            }
        }

        function showLoadingState() {
            document.querySelector('.exam-body').innerHTML = `
                <div class="loading-container">
                    <div class="loading-spinner"></div>
                    <h2>Submitting your exam...</h2>
                    <p>Please wait while we calculate your results.</p>
                </div>
            `;
        }

        function showError(message) {
            document.querySelector('.exam-body').innerHTML = `
                <div class="error-container">
                    <div class="error-icon">⚠️</div>
                    <h2>Submission Error</h2>
                    <p>${message}</p>
                    <button onclick="location.reload()" class="btn-primary">Try Again</button>
                </div>
            `;
        }

        function showResults(result, exam) {
            // Safety checks
            if (!result || !exam) {
                console.error('Missing result or exam data:', { result, exam });
                showError('Unable to display results - missing data');
                return;
            }
            
            if (!exam.questions || !Array.isArray(exam.questions)) {
                console.error('Invalid exam questions data:', exam.questions);
                showError('Unable to display results - invalid exam data');
                return;
            }
            
            const percentage = Math.round((result.score / exam.questions.length) * 100);
            const passed = percentage >= exam.passing_marks;
            
            document.querySelector('.exam-body').innerHTML = `
                <div class="results-container">
                    <div class="results-header">
                        <h1>🎉 Exam Completed!</h1>
                        <p>Thank you for taking the exam, ${result.student_name}!</p>
                    </div>
                    
                    <div class="score-card ${passed ? 'passed' : 'failed'}">
                        <div class="score-circle">
                            <div class="score-percentage">${percentage}%</div>
                            <div class="score-label">Your Score</div>
                        </div>
                        <div class="score-details">
                            <h3>${passed ? '🎉 Congratulations!' : '📚 Keep Studying!'}</h3>
                            <p><strong>Status:</strong> ${passed ? 'PASSED' : 'FAILED'}</p>
                            <p><strong>Correct Answers:</strong> ${result.score}/${exam.questions.length}</p>
                            <p><strong>Passing Marks:</strong> ${exam.passing_marks}%</p>
                            <p><strong>Time Taken:</strong> ${formatTime(result.time_taken)}</p>
                        </div>
                    </div>
                    <div style="margin: 12px 0;">
                        <button id="toggle-explanations-student" class="btn-primary" onclick="toggleStudentExplanations()">Hide Answers & Explanations</button>
                    </div>
                    <div class="question-review" id="student-explanations-section" style="display: block;">
                        <h3>📋 Answers & Explanations</h3>
                        <div class="questions-list">
                            ${exam.questions.map((question, index) => {
                                const userAnswer = result.answers[index];
                                const isCorrect = userAnswer === question.correct_answer;
                                // Safely derive explanation text and image URL
                                let explanationText = '';
                                if (question.explanation !== undefined && question.explanation !== null) {
                                    explanationText = String(question.explanation).trim();
                                } else if (question.Explanation !== undefined && question.Explanation !== null) {
                                    explanationText = String(question.Explanation).trim();
                                }
                                const explanationImageUrl = (question.explanation_image_url && String(question.explanation_image_url).trim()) ||
                                                            (question.explanationImageUrl && String(question.explanationImageUrl).trim()) ||
                                                            (question.ExplanationImageUrl && String(question.ExplanationImageUrl).trim()) || '';
                                return `
                                    <div class="question-item ${isCorrect ? 'correct' : 'incorrect'}">
                                        <div class="question-header">
                                            <span class="question-number">Q${index + 1}</span>
                                            <span class="answer-status">${isCorrect ? '✓ Correct' : '✗ Incorrect'}</span>
                                        </div>
                                        <div class="question-text">${question.question_text}</div>
                                        ${question.question_image_url ? `
                                            <div class="question-image" style="margin: 8px 0;">
                                                <img src="${question.question_image_url}" alt="Question Image" style="max-width: 100%; border-radius: 6px;" />
                                            </div>
                                        ` : ''}
                                        <div class="options-review">
                                            ${question.options.map((option, optIndex) => {
                                                let className = '';
                                                if (optIndex === question.correct_answer) className = 'correct-answer';
                                                if (optIndex === userAnswer && !isCorrect) className = 'wrong-answer';
                                                return `<div class="option-review ${className}">${option}</div>`;
                                            }).join('')}
                                        </div>
                                        <div class="explanation" style="margin-top: 10px;">
                                            <strong>Explanation:</strong>
                                            <p>${explanationText || 'No explanation provided.'}</p>
                                            ${explanationImageUrl ? `
                                                <div class="explanation-image" style="margin-top: 8px;">
                                                    <img src="${explanationImageUrl}" alt="Explanation Image" style="max-width: 100%; border-radius: 6px;" onerror="this.style.display='none'" />
                                                </div>
                                            ` : ''}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function toggleStudentExplanations() {
            const section = document.getElementById('student-explanations-section');
            const btn = document.getElementById('toggle-explanations-student');
            if (!section || !btn) return;
            const isHidden = section.style.display === 'none';
            section.style.display = isHidden ? 'block' : 'none';
            btn.textContent = isHidden ? 'Hide Answers & Explanations' : 'Show Answers & Explanations';
        }

        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = seconds % 60;
            return `${minutes}:${remainingSeconds.toString().padStart(2, '0')}`;
        }

        function showBasicResults(submitData, examData) {
            const percentage = submitData.percentage;
            const passed = percentage >= (examData ? examData.passing_marks : 50);
            
            document.querySelector('.exam-body').innerHTML = `
                <div class="results-container">
                    <div class="results-header">
                        <h1>🎉 Exam Completed!</h1>
                        <p>Thank you for taking the exam, ${studentName}!</p>
                    </div>
                    
                    <div class="score-card ${passed ? 'passed' : 'failed'}">
                        <div class="score-circle">
                            <div class="score-percentage">${percentage}%</div>
                            <div class="score-label">Your Score</div>
                        </div>
                        <div class="score-details">
                            <h3>${passed ? '🎉 Congratulations!' : '📚 Keep Studying!'}</h3>
                            <p><strong>Status:</strong> ${passed ? 'PASSED' : 'FAILED'}</p>
                            <p><strong>Correct Answers:</strong> ${submitData.score}/${submitData.total_questions}</p>
                            <p><strong>Passing Marks:</strong> ${examData ? examData.passing_marks : 50}%</p>
                            <p><strong>Time Taken:</strong> ${formatTime(submitData.time_taken || 0)}</p>
                        </div>
                    </div>
                </div>
            `;
        }

        // Load exam on page load
        loadExam();
        
        // Fallback timer initialization (in case exam loading fails)
        setTimeout(() => {
            if (!timerInterval && timeRemaining === 0) {
                console.log('Fallback timer initialization');
                timeRemaining = 30 * 60; // 30 minutes fallback
                updateTimerDisplay();
                startTimer();
            }
        }, 2000);
    </script>
</body>
</html>

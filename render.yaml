services:
  - type: web
    name: shahriar-medical-academy-mock-exam
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: FLASK_ENV
        value: production

